                    insomnia.expect(json.data).to.have.property('policy_number');
                    insomnia.expect(json.data).to.have.property('status');
                });


                if (insomnia.response.code === 201) {
                    const json = insomnia.response.json();
                    insomnia.collectionVariables.set('created_policy_id', json.data.id);
                }
