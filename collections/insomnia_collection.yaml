      - url: "{{base_url}}/auth/login"
        name: Login
        meta:
          id: req_bf7ac41a07e24f0fab7a0ff397c88349
          created: 1781239472834
          modified: 1781239472834
          isPrivate: false
          description: ""
          sortKey: -1781239469041
        method: POST
        body:
          mimeType: text/plain
          text: |-
            {
              "email": "{{email}}",
              "password": "{{password}}"
            }
        headers:
          - name: Content-Type
            value: application/json
        scripts:
          afterResponse: >-
            insomnia.test('Status code is 200', () => {
                insomnia.response.to.have.status(200);
            });


            insomnia.test('Response time < 2 seconds', () => {
                insomnia.expect(insomnia.response.responseTime).to.be.below(2000);
            });


            insomnia.test('Content-Type is application/json', () => {
                insomnia.expect(insomnia.response.headers.get('Content-Type')).to.include('application/json');
            });


            insomnia.test('Response has token and user with role', () => {
                const json = insomnia.response.json();
                insomnia.expect(json).to.have.property('token');
                insomnia.expect(json.user).to.have.property('role');
            });


            if (insomnia.response.code === 200) {
                const json = insomnia.response.json();
                insomnia.collectionVariables.set('auth_token', json.token);
            }
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{base_url}}/accounts"
        name: Create Account
        meta:
          id: req_b7c633eaee784c4d8c6e76d86b1877d4
          created: 1781239472838
          modified: 1781240282288
          isPrivate: false
          description: ""
          sortKey: -1781239469040
        method: POST
        body:
          mimeType: text/plain
          text: |-
            {
              "account": {
                  "first_name": "{{$randomFirstName}}",
                  "last_name": "{{$randomLastName}}",
                  "email": "{{$randomEmail}}",
                  "phone": "{{$randomPhoneNumber}}",
                  "address": {
                    "address_line1": "{{$randomStreet}}",
                    "city": "{{$randomCity}}",
                    "state": "{{$randomStateAbbr}}",
                    "zip_code": "{{$randomZipCode}}"
                  }
              }
            }
        headers:
          - name: Content-Type
            value: application/json
          - name: Authorization
            value: Bearer {{auth_token}}
        authentication:
          type: bearer
          disabled: false
          token: "{{auth_token}}"
          prefix: ""
        scripts:
          afterResponse: >-
            insomnia.test('Status code is 201', () => {
                insomnia.response.to.have.status(201);
            });


            insomnia.test('Response time < 2 seconds', () => {
                insomnia.expect(insomnia.response.responseTime).to.be.below(2000);
            });


            insomnia.test('Content-Type is application/json', () => {
                insomnia.expect(insomnia.response.headers.get('Content-Type')).to.include('application/json');
            });


            insomnia.test('Response body has data with id and email', () => {
                const json = insomnia.response.json();
                insomnia.expect(json).to.have.property('data');
                insomnia.expect(json.data).to.have.property('id');
                insomnia.expect(json.data).to.have.property('email');
            });


            if (insomnia.response.code === 201) {
                const json = insomnia.response.json();
                insomnia.collectionVariables.set('created_account_id', json.data.id);
            }
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
